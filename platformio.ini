[env:esp32-c3-super-mini]
platform = espressif32@^6.0.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages = 
    framework-arduinoespressif32@^3.20014.231204
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
build_src_filter = +<main.cpp> -<test_display.cpp>
; Build flags for WAV simulator - SPIFFS for better performance
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DUSE_SPIFFS=1

; Libraries for complete project
lib_deps = 
    ; Web Server and WiFi
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    bblanchon/ArduinoJson@^6.21.3
    
    ; Display with U8G2 - WORKING configuration
    olikraus/U8g2@^2.35.19
    
    ; NFC and sensors
    miguelbalboa/MFRC522@^1.4.11
    
    ; WAV simulation mode - no external audio libraries needed

; Partition scheme for more storage - SPIFFS for performance
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs

; OTA Updates
upload_protocol = esptool

; Memory optimization
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio